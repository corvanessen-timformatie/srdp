{{- /* Zitadel logs in as its own role, which srdp-setup creates, so Zitadel needs the Job. */ -}}
{{- if .Values.zitadel.enabled }}
{{- if not .Values.setup.enabled }}
{{- fail "zitadel.enabled needs setup.enabled: the srdp-setup Job creates the zitadel role and database." }}
{{- end }}
{{- $zitadelDb := dict }}
{{- range .Values.setup.databases }}
{{- if eq .name "zitadel" }}
{{- $zitadelDb = . }}
{{- end }}
{{- end }}
{{- if not $zitadelDb }}
{{- fail "zitadel.enabled needs a zitadel entry in setup.databases." }}
{{- end }}
{{- if eq (toString (get $zitadelDb "enabled")) "false" }}
{{- fail "The zitadel entry in setup.databases must not be disabled, srdp-setup creates the zitadel role and database." }}
{{- end }}
{{- end }}
